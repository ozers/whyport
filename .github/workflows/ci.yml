name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core checks
        run: app/build-app.sh --test
      - name: Build universal app
        run: app/build-app.sh --universal

  cli:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
