name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core checks
        run: app/build-app.sh --test
      - name: Build universal app and disk image
        run: app/build-app.sh --universal --dmg
      - uses: actions/upload-artifact@v4
        with:
          name: WhyPort.dmg
          path: app/.build/WhyPort.dmg
          retention-days: 14

  cli:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
